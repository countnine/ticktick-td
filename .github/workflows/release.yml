name: Release

# v1.2.3 형태의 태그를 밀면 npm 에 발행한다.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publisher(OIDC)는 npm 11.5.1 이상을 요구한다. 러너에 딸려오는 버전이
      # 그보다 낮을 수 있어 명시적으로 올린다.
      - run: npm install -g npm@latest

      - run: npm install --no-audit --no-fund

      - run: npm test

      # 태그(v1.2.3)와 package.json 의 version 이 어긋난 채 발행되는 사고를 막는다.
      - name: 태그와 버전 일치 확인
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "태그 $tag 와 package.json 의 $pkg 가 다릅니다" >&2
            exit 1
          fi

      # npm 의 Trusted Publisher(OIDC) 로 인증한다. id-token: write 만 있으면 되고
      # NPM_TOKEN 같은 시크릿은 필요 없다. provenance 도 자동으로 붙는다.
      - run: npm publish --access public
